server.port=${PORT:8080}

spring.application.name=flexbid

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

springdoc.swagger-ui.path=/swagger-ui.html


# =================
# MAIL CONFIG
# =================

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.from=${MAIL_USERNAME}


# =================
# RAZORPAY CONFIG
# =================

razorpay.key_id=${RAZORPAY_KEY_ID}
razorpay.key_secret=${RAZORPAY_KEY_SECRET}


# =================
# LOGGING
# =================

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.messaging=DEBUG
logging.level.org.springframework.web.socket=TRACE
logging.level.org.springframework.messaging.simp=TRACE


# =================
# SECURITY
# =================

spring.security.user.name=${SECURITY_USERNAME}
spring.security.user.password=${SECURITY_PASSWORD}


# =================
# WEBSOCKET
# =================

spring.websocket.heartbeat.send-interval=10000
spring.websocket.heartbeat.receive-interval=10000


# =================
# SERVER
# =================

server.tomcat.connection-timeout=30s
server.tomcat.max-connections=1000

server.connection-timeout=30s